# Rebuilds the static blog pages from Supabase every hour, and on demand.
# The AI blog tool (or anyone) can trigger it straight away from GitHub →
# Actions → "Build blog pages" → Run workflow.
name: Build blog pages
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [blog-published]
permissions:
  contents: write
concurrency:
  group: blog-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bleach
      - run: python3 tools/build_blog.py
      - name: Commit changes
        id: commit
        run: |
          git add blog sitemap.xml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git commit -m "Update blog pages"
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: Tell Bing about new or updated posts (IndexNow)
        if: steps.commit.outputs.changed == 'yes'
        run: |
          sleep 90
          URLS=$(git diff --name-only HEAD~1 HEAD -- 'blog/*.html' | sed 's#^#https://masterartist.co/#'; echo https://masterartist.co/blog.html)
          JSON=$(printf '%s\n' $URLS | python3 -c 'import sys,json; print(json.dumps({"host":"masterartist.co","key":"475d9c85bff5d57bf277e4d7e5d51074","keyLocation":"https://masterartist.co/475d9c85bff5d57bf277e4d7e5d51074.txt","urlList":[l.strip() for l in sys.stdin if l.strip()]}))')
          curl -sS -o /dev/null -w "IndexNow response: %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$JSON"
