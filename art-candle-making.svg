<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="warm" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#FBF1DC"/>
      <stop offset="1" stop-color="#EFE0C2"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFD982" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FFD982" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C9"/>
      <stop offset=".55" stop-color="#FFC24A"/>
      <stop offset="1" stop-color="#F07A1A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".25" stop-color="#FFFFFF" stop-opacity=".15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#warm)"/>
  <!-- table -->
  <rect x="0" y="430" width="800" height="170" fill="#C9A273"/>
  <rect x="0" y="430" width="800" height="12" fill="#B48A5C"/>
  <!-- halos -->
  <circle cx="250" cy="250" r="120" fill="url(#halo)"/>
  <circle cx="420" cy="200" r="140" fill="url(#halo)"/>
  <circle cx="580" cy="270" r="110" fill="url(#halo)"/>
  <!-- jar 1: lavender -->
  <g>
    <rect x="180" y="300" width="140" height="150" rx="18" fill="#C6B7E2"/>
    <rect x="180" y="300" width="140" height="150" rx="18" fill="url(#glass)"/>
    <ellipse cx="250" cy="300" rx="70" ry="14" fill="#EDE7F6"/>
    <rect x="198" y="360" width="104" height="44" rx="6" fill="#3B1C5A"/>
    <text x="250" y="389" font-family="Georgia, serif" font-size="19" fill="#E6B44C" text-anchor="middle" font-style="italic">lavender</text>
    <rect x="247" y="262" width="6" height="36" rx="3" fill="#3A2A1A"/>
    <path d="M250 196 C 270 226, 266 254, 250 264 C 234 254, 230 226, 250 196 Z" fill="url(#flame)"/>
  </g>
  <!-- jar 2: tall gold, Christmas -->
  <g>
    <rect x="345" y="250" width="150" height="200" rx="20" fill="#E6B44C"/>
    <rect x="345" y="250" width="150" height="200" rx="20" fill="url(#glass)"/>
    <ellipse cx="420" cy="250" rx="75" ry="15" fill="#FBF1DC"/>
    <rect x="365" y="320" width="110" height="58" rx="6" fill="#F6F1E8"/>
    <text x="420" y="345" font-family="Georgia, serif" font-size="17" fill="#3B1C5A" text-anchor="middle" font-style="italic">pine &amp;</text>
    <text x="420" y="367" font-family="Georgia, serif" font-size="17" fill="#3B1C5A" text-anchor="middle" font-style="italic">cinnamon</text>
    <rect x="417" y="212" width="6" height="36" rx="3" fill="#3A2A1A"/>
    <path d="M420 140 C 444 174, 440 204, 420 216 C 400 204, 396 174, 420 140 Z" fill="url(#flame)"/>
  </g>
  <!-- jar 3: small purple tin -->
  <g>
    <rect x="520" y="340" width="120" height="110" rx="14" fill="#54306F"/>
    <ellipse cx="580" cy="340" rx="60" ry="12" fill="#F3E3C0"/>
    <rect x="520" y="380" width="120" height="8" fill="#E6B44C"/>
    <rect x="577" y="304" width="6" height="34" rx="3" fill="#3A2A1A"/>
    <path d="M580 244 C 598 272, 594 296, 580 306 C 566 296, 562 272, 580 244 Z" fill="url(#flame)"/>
  </g>
  <!-- pine sprigs and berries -->
  <g stroke="#2F6B45" stroke-width="5" stroke-linecap="round">
    <path d="M90 470 L 170 440"/>
    <path d="M110 463 l -6 -18 M126 457 l -4 -19 M142 451 l -3 -19 M110 463 l 2 18 M126 457 l 4 17 M142 451 l 5 17"/>
    <path d="M660 476 L 740 448"/>
    <path d="M680 469 l -5 -18 M696 463 l -3 -19 M712 457 l -2 -18 M680 469 l 3 17 M696 463 l 5 16 M712 457 l 6 16"/>
  </g>
  <g fill="#B3261E"><circle cx="172" cy="446" r="8"/><circle cx="160" cy="458" r="7"/><circle cx="650" cy="478" r="8"/><circle cx="662" cy="490" r="7"/></g>
  <!-- wax pouring jug -->
  <g transform="translate(70 300)">
    <path d="M0 0 H70 V90 C70 104 60 110 50 110 H20 C10 110 0 104 0 90 Z" fill="#B8B8C4"/>
    <path d="M70 18 C 100 18, 100 70, 70 70" fill="none" stroke="#9A9AA8" stroke-width="10"/>
    <ellipse cx="35" cy="0" rx="35" ry="8" fill="#F6E9C9"/>
  </g>
  <!-- wax chips -->
  <g fill="#F6E9C9" stroke="#E2CFA5" stroke-width="2">
    <rect x="250" y="490" width="22" height="14" rx="4" transform="rotate(14 261 497)"/>
    <rect x="290" y="510" width="18" height="12" rx="4" transform="rotate(-20 299 516)"/>
    <rect x="520" y="500" width="20" height="13" rx="4" transform="rotate(30 530 506)"/>
  </g>
</svg>
