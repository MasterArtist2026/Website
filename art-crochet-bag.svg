<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE7F6"/>
      <stop offset="1" stop-color="#D9CCEE"/>
    </linearGradient>
    <pattern id="stitch" width="36" height="30" patternUnits="userSpaceOnUse">
      <rect width="36" height="30" fill="#E6B44C"/>
      <path d="M2 28 C 6 6, 16 2, 18 2 C 20 2, 30 6, 34 28" fill="none" stroke="#C79733" stroke-width="5" stroke-linecap="round"/>
      <path d="M18 4 V 28" stroke="#F2CC79" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="stitch2" width="36" height="30" patternUnits="userSpaceOnUse">
      <rect width="36" height="30" fill="#F6F1E8"/>
      <path d="M2 28 C 6 6, 16 2, 18 2 C 20 2, 30 6, 34 28" fill="none" stroke="#DCCFB8" stroke-width="5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- table -->
  <rect x="0" y="470" width="800" height="130" fill="#BFA98A"/>
  <!-- bag handles -->
  <path d="M290 250 C 290 120, 510 120, 510 250" fill="none" stroke="#C79733" stroke-width="34" stroke-linecap="round"/>
  <path d="M290 250 C 290 120, 510 120, 510 250" fill="none" stroke="#E6B44C" stroke-width="22" stroke-linecap="round" stroke-dasharray="10 8"/>
  <!-- bag body -->
  <path d="M230 240 H570 L 548 500 C 546 516, 534 524, 518 524 H282 C 266 524, 254 516, 252 500 Z" fill="url(#stitch)"/>
  <path d="M236 300 H564 L 560 344 H240 Z" fill="url(#stitch2)"/>
  <path d="M244 404 H556 L 553 440 H247 Z" fill="#3B1C5A" opacity=".9"/>
  <path d="M230 240 H570 L 548 500 C 546 516, 534 524, 518 524 H282 C 266 524, 254 516, 252 500 Z" fill="none" stroke="#A97E27" stroke-width="6" stroke-linejoin="round"/>
  <rect x="222" y="232" width="356" height="26" rx="12" fill="#C79733"/>
  <!-- yarn ball -->
  <g transform="translate(640 420)">
    <circle r="78" fill="#7A5AA6"/>
    <g fill="none" stroke="#9C80C6" stroke-width="7" stroke-linecap="round">
      <path d="M-70 -20 C -30 -60, 40 -60, 74 -10"/>
      <path d="M-76 10 C -30 -30, 40 -30, 78 20"/>
      <path d="M-66 40 C -24 0, 40 4, 66 44"/>
      <path d="M-30 -72 C 10 -30, 14 30, -10 76"/>
      <path d="M10 -76 C 44 -30, 46 30, 30 72"/>
    </g>
    <path d="M-60 50 C -120 90, -200 60, -260 80" fill="none" stroke="#7A5AA6" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- crochet hook -->
  <g transform="translate(110 470) rotate(-28)">
    <rect x="0" y="-8" width="190" height="16" rx="8" fill="#3B1C5A"/>
    <rect x="70" y="-11" width="56" height="22" rx="8" fill="#E6B44C"/>
    <path d="M190 -8 H 214 C 226 -8, 230 4, 218 8 H 206 C 202 8, 202 2, 206 2 H 214 C 218 2, 218 -2, 214 -2 H 190 Z" fill="#B8B8C4"/>
  </g>
  <!-- small yarn ball -->
  <g transform="translate(150 380)">
    <circle r="44" fill="#F6F1E8"/>
    <g fill="none" stroke="#DCCFB8" stroke-width="5" stroke-linecap="round">
      <path d="M-40 -10 C -16 -34, 20 -34, 42 -4"/>
      <path d="M-42 12 C -16 -12, 22 -12, 42 16"/>
      <path d="M-14 -42 C 6 -16, 8 18, -4 42"/>
    </g>
  </g>
  <g fill="#E6B44C" opacity=".8">
    <path d="M660 120 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z"/>
    <path d="M120 140 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
  </g>
</svg>
