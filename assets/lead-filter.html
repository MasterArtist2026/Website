<script>
/* Drop generate_lead hits unless the trial form has just saved a row.
   GA4 create-event rule 16134847184 copies every page_view whose
   page_location contains Masterartist.co into generate_lead. */
(function(){
  function leadUrl(url){ return /(?:^|[?&#])en=generate_lead(?:&|$)/.test(String(url||'')); }
  function blocked(url){ return leadUrl(url) && !(window.__allowGenerateLead > 0); }
  if (navigator.sendBeacon) {
    var beacon = navigator.sendBeacon.bind(navigator);
    navigator.sendBeacon = function(url, data){ if (blocked(url)) return true; return beacon(url, data); };
  }
  if (window.fetch) {
    var origFetch = window.fetch.bind(window);
    window.fetch = function(input, init){
      var url = typeof input === 'string' ? input : (input && input.url) || '';
      if (blocked(url)) return Promise.resolve(new Response('', {status:204}));
      return origFetch(input, init);
    };
  }
  var desc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
  if (desc && desc.set) {
    Object.defineProperty(HTMLImageElement.prototype, 'src', {
      configurable: true, enumerable: desc.enumerable, get: desc.get,
      set: function(value){ if (!blocked(value)) desc.set.call(this, value); }
    });
  }
  var xo = XMLHttpRequest.prototype.open, xs = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function(method, url){ this.__leadUrl = url; return xo.apply(this, arguments); };
  XMLHttpRequest.prototype.send = function(body){ if (blocked(this.__leadUrl)) return; return xs.apply(this, arguments); };
})();
</script>
