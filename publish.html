<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Publish blog draft — Master Artist</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Opened from the "Publish now" button in a blog draft review email.
     The link carries a one-time token (in the # part, so it never reaches a
     server log); nothing is published until the button here is pressed. -->
<style>
  :root { --ink:#2A1740; --purple:#3B1C5A; --gold:#E6B44C; --bg:#FBF8F3; --card:#fff; --muted:#6B5C7B; --line:#E8E1EE; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         background:var(--bg); color:var(--ink); font:16px/1.55 'Plus Jakarta Sans', Arial, Helvetica, sans-serif; }
  .card { width:100%; max-width:520px; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .bar { background:var(--purple); color:#fff; font-weight:700; font-size:14px; padding:12px 20px; }
  .in { padding:24px 20px; }
  h1 { font-size:22px; line-height:1.3; margin:0 0 8px; color:var(--purple); }
  p { margin:0 0 14px; }
  .muted { color:var(--muted); font-size:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .btn { appearance:none; border:0; border-radius:8px; padding:12px 20px; font:inherit; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; }
  .gold { background:var(--gold); color:var(--ink); }
  .ghost { background:transparent; color:var(--purple); border:1px solid var(--line); }
  .btn[disabled] { opacity:.6; cursor:wait; }
  .ok { color:#1E6B3A; font-weight:700; }
  .err { color:#9B1C1C; font-weight:700; }
</style>
</head>
<body>
<main class="card">
  <div class="bar">Master Artist · Publish blog draft</div>
  <div class="in" id="out"><p class="muted">Checking the link…</p></div>
</main>
<script>
(() => {
  const API = 'https://fudaosneozobacdalncv.supabase.co/rest/v1/rpc/';
  // Public, read-only key (same one the website uses); the token does the checking
  const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1ZGFvc25lb3pvYmFjZGFsbmN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTIwNDUsImV4cCI6MjEwMjQ2ODA0NX0.0PKbkncE8goPg-iJlAUacNUa3MjWJSj1ZLeqTpkqPZ0';
  const out = document.getElementById('out');
  const q = new URLSearchParams(location.hash.slice(1));
  const slug = q.get('slug') || '', token = q.get('t') || '';
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const admin = `/admin.html#blog/${encodeURIComponent(slug)}`;
  const rpc = (fn, body) => fetch(API + fn, {
    method: 'POST',
    headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const fail = msg => {
    out.innerHTML = `<p class="err">${esc(msg)}</p>
      <p class="muted">You can still review and publish it in the admin panel.</p>
      <div class="row"><a class="btn ghost" href="${admin}">Open admin panel</a></div>`;
  };

  async function load() {
    if (!slug || !token) return fail('This link is incomplete.');
    const res = await rpc('blog_review_info', { p_slug: slug, p_token: token }).catch(() => null);
    const rows = res && res.ok ? await res.json() : [];
    if (!rows.length) return fail('This link has expired or has already been used.');
    const p = rows[0];
    out.innerHTML = `<h1>${esc(p.title)}</h1>
      <p class="muted">${esc(p.excerpt)}</p>
      <p>Publishing puts this post on the blog straight away. Its own page follows within the hour.</p>
      <div class="row">
        <button class="btn gold" id="go">Publish now</button>
        <a class="btn ghost" href="${admin}">Edit in admin first</a>
      </div>`;
    document.getElementById('go').onclick = publish;
  }

  async function publish() {
    const btn = document.getElementById('go');
    btn.disabled = true; btn.textContent = 'Publishing…';
    const res = await rpc('blog_publish_with_token', { p_slug: slug, p_token: token }).catch(() => null);
    if (!res || !res.ok) return fail('Could not publish: the link may have expired or already been used.');
    history.replaceState(null, '', location.pathname);  // drop the used token from the address bar
    out.innerHTML = `<p class="ok">Published.</p>
      <p>It's on the blog now. Its own page, masterartist.co/blog/${esc(slug)}.html, appears within the hour.</p>
      <div class="row">
        <a class="btn gold" href="/post.html?slug=${encodeURIComponent(slug)}">View the post</a>
        <a class="btn ghost" href="/blog.html">Blog</a>
      </div>`;
  }

  load();
})();
</script>
</body>
</html>
